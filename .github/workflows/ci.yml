# Tests automatiques : à chaque push et pull request, sur une base PostgreSQL 17 jetable.
# Les tests créent leur propre schéma (tests/helpers/server.js) : aucune donnée à préparer.
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

# Une seule exécution par branche : une nouvelle poussée annule la précédente
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dzimmo
          POSTGRES_PASSWORD: dzimmo
          POSTGRES_DB: dzimmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dzimmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dzimmo:dzimmo@localhost:5432/dzimmo
      PG_BIN_DIR: /usr/lib/postgresql/17/bin

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # pg_dump / pg_restore en version 17 (celle du serveur) : les tests de sauvegarde s'en servent
      - name: Outils client PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - run: npm ci

      - run: npm test
